# Template only — copy to secrets.yaml (gitignored by convention), fill in
# real values, `kubectl apply`. In production these come from a secret
# manager (GCP Secret Manager via ExternalSecrets), never a committed file.
apiVersion: v1
kind: Secret
metadata:
  name: relay-secrets
type: Opaque
stringData:
  DATABASE_URL: ecto://USER:PASSWORD@HOST/relay_prod
  SECRET_KEY_BASE: generate-with-mix-phx.gen.secret
