apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-frontend
  labels:
    app: relay-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relay-frontend
  template:
    metadata:
      labels:
        app: relay-frontend
    spec:
      containers:
        - name: frontend
          image: relay-frontend:0.1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: relay-frontend
spec:
  selector:
    app: relay-frontend
  ports:
    - port: 80
      targetPort: 80
