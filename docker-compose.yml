# Full stack in containers: postgres + Phoenix release + nginx-served SPA.
# (Written as a deploy prop and for machines with Docker; local development
# on this repo runs `mix phx.server` + `npm run dev` directly.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_password
      POSTGRES_DB: relay_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Run migrations, then start — the release ships Relay.Release for exactly
    # this (there is no Mix inside the container).
    command: sh -c 'bin/relay eval "Relay.Release.migrate()" && bin/relay start'
    environment:
      DATABASE_URL: ecto://relay:relay_dev_password@db/relay_prod
      # Generate with `mix phx.gen.secret` and export before `docker compose up`:
      #   export SECRET_KEY_BASE=$(cd backend && mix phx.gen.secret)
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run "mix phx.gen.secret" and export SECRET_KEY_BASE}
      PHX_HOST: localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
